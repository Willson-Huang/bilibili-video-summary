<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>任务进度看板</title>
<style>
  :root{
    --bg:#060911; --panel:rgba(17,23,39,.72); --line:rgba(120,150,220,.14);
    --txt:#e8eefc; --dim:#8296b8; --cyan:#22d3ee; --violet:#a78bfa;
    --emerald:#34d399; --rose:#fb7185; --amber:#fbbf24; --blue:#60a5fa;
    --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,"SF Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--txt); overflow-x:hidden;
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  }
  /* 背景：极光 + 网格 */
  body::before{
    content:""; position:fixed; inset:-20%; z-index:0; pointer-events:none;
    background:
      radial-gradient(48% 40% at 12% 8%, rgba(34,211,238,.16), transparent 62%),
      radial-gradient(46% 42% at 88% 4%, rgba(167,139,250,.16), transparent 60%),
      radial-gradient(52% 46% at 72% 96%, rgba(52,211,153,.10), transparent 62%);
    animation:drift 24s ease-in-out infinite alternate;
  }
  body::after{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5;
    background-image:linear-gradient(rgba(120,150,220,.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(120,150,220,.05) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(120% 90% at 50% 0%,#000 30%,transparent 85%);
  }
  @keyframes drift{to{transform:translate3d(-3%,2%,0) scale(1.06)}}

  .wrap{position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:26px 22px 90px}

  header{display:flex; align-items:center; gap:26px; flex-wrap:wrap;
    padding:20px 24px; border:1px solid var(--line); border-radius:20px;
    background:linear-gradient(160deg,rgba(22,30,52,.86),rgba(12,17,30,.72));
    backdrop-filter:blur(14px); box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .brand{flex:1 1 320px; min-width:260px}
  .kicker{font:600 11px/1 var(--mono); letter-spacing:.22em; color:var(--cyan);
    text-transform:uppercase; opacity:.9}
  h1{margin:9px 0 6px; font-size:23px; font-weight:700; letter-spacing:.01em}
  .sub{color:var(--dim); font-size:12.5px; transition:color .4s ease}
  /* 最后更新的新鲜度：数据迟迟不刷新不该和“刚刚”长得一样 */
  .sub.stale-warn{color:var(--amber)}
  .sub.stale-bad{color:var(--rose)}
  .live{display:inline-flex; align-items:center; gap:7px; margin-top:10px;
    font:600 11px/1 var(--mono); color:var(--emerald)}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--emerald);
    box-shadow:0 0 0 0 rgba(52,211,153,.7); animation:pulse 1.8s infinite}
  .live.dead{color:var(--rose)} .live.dead .dot{background:var(--rose); animation:none}
  @keyframes pulse{70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

  .ring{position:relative; width:148px; height:148px; flex:0 0 auto}
  .ring svg{transform:rotate(-90deg); display:block}
  .ring .pct{position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px}
  .ring .pct b{font:700 30px/1 var(--mono);
    background:linear-gradient(92deg,var(--cyan),var(--violet));
    -webkit-background-clip:text; background-clip:text; color:transparent}
  .ring .pct span{font:600 9.5px/1 var(--mono); letter-spacing:.2em; color:var(--dim)}

  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(126px,1fr));
    gap:11px; margin:16px 0 20px}
  .stat{border:1px solid var(--line); border-radius:14px; padding:12px 14px;
    background:var(--panel); backdrop-filter:blur(10px)}
  .stat i{display:block; font:600 10px/1 var(--mono); letter-spacing:.16em;
    color:var(--dim); font-style:normal; text-transform:uppercase}
  .stat b{display:block; margin-top:7px; font:700 19px/1.15 var(--mono)}
  .stat.c b{color:var(--cyan)} .stat.e b{color:var(--emerald)}
  .stat.r b{color:var(--rose)} .stat.a b{color:var(--amber)}

  .list{display:flex; flex-direction:column; gap:11px}
  .row{position:relative; overflow:hidden; display:grid;
    grid-template-columns:44px 1fr auto; gap:16px; align-items:center;
    padding:15px 18px; border:1px solid var(--line); border-radius:15px;
    background:var(--panel); backdrop-filter:blur(10px);
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease}
  .row:hover{transform:translateY(-2px); border-color:rgba(34,211,238,.4);
    box-shadow:0 12px 30px rgba(0,0,0,.42)}
  .row.active{border-color:rgba(34,211,238,.5)}
  .row.active::before{content:""; position:absolute; left:0; top:0; bottom:0; width:2px;
    background:linear-gradient(180deg,var(--cyan),var(--violet)); animation:breathe 2s infinite}
  @keyframes breathe{50%{opacity:.35}}
  .row.done{border-color:rgba(52,211,153,.3)}
  .row.fail{border-color:rgba(251,113,133,.42)}

  .idx{width:44px; height:44px; border-radius:12px; display:grid; place-items:center;
    font:700 14px/1 var(--mono); color:var(--dim);
    border:1px solid var(--line); background:rgba(120,150,220,.06)}
  .row.active .idx{color:var(--cyan); border-color:rgba(34,211,238,.42)}
  .row.done .idx{color:var(--emerald); border-color:rgba(52,211,153,.36)}
  .row.fail .idx{color:var(--rose); border-color:rgba(251,113,133,.4)}

  .meta{min-width:0}
  .ttl{font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis}
  .tags{display:flex; align-items:center; gap:9px; margin-top:6px; flex-wrap:wrap;
    font:500 11.5px/1 var(--mono); color:var(--dim)}
  .badge{padding:3px 8px; border-radius:6px; font-weight:600; letter-spacing:.04em;
    border:1px solid transparent}
  .grp{padding:3px 8px; border-radius:6px; font-weight:600; letter-spacing:.04em;
    color:var(--violet); border:1px solid rgba(167,139,250,.34);
    background:rgba(167,139,250,.1)}
  .b-queued{color:var(--dim); border-color:var(--line); background:rgba(120,150,220,.07)}
  .b-download,.b-convert{color:var(--blue); border-color:rgba(96,165,250,.36); background:rgba(96,165,250,.1)}
  .b-asr{color:var(--cyan); border-color:rgba(34,211,238,.4); background:rgba(34,211,238,.1)}
  .b-notes{color:var(--violet); border-color:rgba(167,139,250,.42); background:rgba(167,139,250,.11)}
  .b-done{color:var(--emerald); border-color:rgba(52,211,153,.4); background:rgba(52,211,153,.1)}
  .b-fail{color:var(--rose); border-color:rgba(251,113,133,.42); background:rgba(251,113,133,.1)}
  .note{color:var(--dim); font-size:11.5px; margin-top:5px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis}
  .note.warn{color:var(--rose)}

  .bar{margin-top:9px; height:7px; border-radius:99px; overflow:hidden;
    background:rgba(120,150,220,.12); position:relative}
  .bar>i{display:block; height:100%; border-radius:99px; width:0;
    background:linear-gradient(90deg,var(--cyan),var(--violet));
    transition:width .5s cubic-bezier(.4,0,.2,1); position:relative; overflow:hidden}
  .bar>i::after{content:""; position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
    animation:shim 1.5s linear infinite}
  @keyframes shim{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  .row.done .bar>i{background:linear-gradient(90deg,var(--emerald),#6ee7b7)}
  .row.fail .bar>i{background:linear-gradient(90deg,var(--rose),#fda4af)}
  .row.queued .bar>i::after,.row.done .bar>i::after{animation:none; opacity:0}

  .num{text-align:right; min-width:104px}
  .num b{display:block; font:700 21px/1 var(--mono)}
  .num span{display:block; margin-top:6px; font:500 11px/1.35 var(--mono); color:var(--dim)}
  .row.active .num b{color:var(--cyan)}
  .row.done .num b{color:var(--emerald)}
  .row.fail .num b{color:var(--rose)}

  .ticker{margin-top:22px; border:1px solid var(--line); border-radius:16px;
    background:var(--panel); backdrop-filter:blur(10px); overflow:hidden}
  .ticker h2{margin:0; padding:12px 18px; font:600 10.5px/1 var(--mono);
    letter-spacing:.2em; color:var(--dim); text-transform:uppercase;
    border-bottom:1px solid var(--line)}
  .ticker ul{list-style:none; margin:0; padding:9px 18px 14px}
  .ticker li{display:flex; gap:12px; padding:5px 0; font:500 12px/1.5 var(--mono);
    border-bottom:1px dashed rgba(120,150,220,.09)}
  .ticker li:last-child{border:0}
  .ticker .t{color:var(--dim); flex:0 0 62px}
  .ticker .s{flex:0 0 74px; color:var(--violet)}
  .ticker .n{color:var(--txt); opacity:.88; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis}
  .empty{padding:46px; text-align:center; color:var(--dim)}
  .empty b{display:block; font:600 15px/1.6 var(--mono); color:var(--txt); margin-bottom:6px}
  /* 任务组：两个 skill 共用一个看板时用来区分来源 */
  .groups{display:flex; gap:9px; flex-wrap:wrap; margin:-8px 0 16px}
  .groups:empty{display:none}
  .gchip{display:flex; align-items:center; gap:9px; padding:7px 12px; border-radius:11px;
    border:1px solid var(--line); background:var(--panel); font:600 11.5px/1 var(--mono);
    color:var(--dim)}
  .gchip b{color:var(--cyan); font-weight:700}
  .gchip .gbar{width:52px; height:4px; border-radius:99px; background:rgba(120,150,220,.16);
    overflow:hidden}
  .gchip .gbar>i{display:block; height:100%; width:0; border-radius:99px;
    background:linear-gradient(90deg,var(--cyan),var(--violet));
    transition:width .5s cubic-bezier(.4,0,.2,1)}
  @media (prefers-reduced-motion:reduce){
    body::before{animation:none} .bar>i::after{animation:none}
    .row.active::before{animation:none} .dot{animation:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="kicker">Bilibili Video Summary · Pipeline</div>
      <h1 id="title">任务进度</h1>
      <div class="sub" id="sub">等待数据…</div>
      <div class="live" id="live"><span class="dot"></span><span id="liveTxt">实时连接</span></div>
    </div>
    <div class="ring">
      <svg width="148" height="148" viewBox="0 0 148 148" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/>
          </linearGradient>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <circle cx="74" cy="74" r="62" fill="none" stroke="rgba(120,150,220,.14)" stroke-width="10"/>
        <circle id="arc" cx="74" cy="74" r="62" fill="none" stroke="url(#g)" stroke-width="10"
                stroke-linecap="round" stroke-dasharray="389.6" stroke-dashoffset="389.6"
                filter="url(#glow)" style="transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)"/>
      </svg>
      <div class="pct"><b id="opct">0%</b><span>OVERALL</span></div>
    </div>
  </header>

  <div class="stats">
    <div class="stat c"><i>总进度</i><b id="sPct">0%</b></div>
    <div class="stat e"><i>已完成</i><b id="sDone">0 / 0</b></div>
    <div class="stat a"><i>进行中</i><b id="sActive">0</b></div>
    <div class="stat r"><i>失败</i><b id="sFail">0</b></div>
    <div class="stat"><i>已耗时</i><b id="sElapsed">—</b></div>
    <div class="stat a"><i>预计剩余</i><b id="sEta">—</b></div>
  </div>

  <div class="groups" id="groups"></div>

  <div class="list" id="list"></div>

  <div class="ticker">
    <h2>Event Stream</h2>
    <ul id="log"></ul>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const CIRC = 2 * Math.PI * 62;
const POLL = 700, POLL_HIDDEN = 3000;

/* ---------- 工具 ---------- */
function fmt(s) {
  if (s === null || s === undefined || isNaN(s)) return '—';
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  if (h) return `${h}h${String(m).padStart(2, '0')}m`;
  return m ? `${m}m${String(x).padStart(2, '0')}s` : `${x}s`;
}
const clock = ts => new Date(ts * 1000).toLocaleTimeString('zh-CN', {hour12: false});
/* 相对时间：绝对时刻一直在跳不等于数据在更新，而“若干秒前”才是可判断的信号 ——
   管线停更时它会持续增长，而不是继续装作在动。 */
function ago(sec) {
  sec = Math.max(0, sec);
  if (sec < 1.5) return '刚刚';
  if (sec < 60) return `${Math.floor(sec)} 秒前`;
  const m = Math.floor(sec / 60);
  return m < 60 ? `${m} 分 ${Math.floor(sec % 60)} 秒前` : `${Math.floor(m / 60)} 小时 ${m % 60} 分前`;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
/* 只在值真正变化时写 DOM —— 避免无谓的重排/重绘 */
function setText(el, v) { v = v == null ? '' : String(v); if (el && el.textContent !== v) el.textContent = v; }
function setAttr(el, k, v) { if (el && el.getAttribute(k) !== v) el.setAttribute(k, v); }
function setClass(el, v) { if (el && el.className !== v) el.className = v; }

/* 脚本一抛异常，数字就会静默冻结（此前出现过 #sub 卡在“等待数据…”）——
   把异常直接显示出来，别让人误判成“任务停了” */
function showFatal(msg) {
  setText($('sub'), '看板脚本异常：' + msg);
  setClass($('sub'), 'sub stale-bad');
  const lv = $('live');
  if (lv) lv.classList.add('dead');
}
addEventListener('error', e => showFatal((e && e.message) || '未知错误'));
addEventListener('unhandledrejection', e =>
  showFatal('promise ' + ((e.reason && e.reason.message) || e.reason)));

const rowClass = st => st === 'done' ? 'done' : st === 'fail' ? 'fail'
                     : st === 'queued' ? 'queued' : 'active';

/* ---------- 任务行：节点复用 + 字段 diff ---------- */
const nodes = new Map();

function makeRow() {
  const el = document.createElement('div');
  el.className = 'row queued';
  el.innerHTML = `
    <div class="idx"></div>
    <div class="meta">
      <div class="ttl"></div>
      <div class="tags">
        <span class="grp"></span><span class="badge"></span><span class="up"></span>
        <span class="dur"></span><span class="pred"></span><span class="tid"></span>
      </div>
      <div class="bar"><i></i></div>
      <div class="note"></div>
    </div>
    <div class="num"><b></b><span></span></div>`;
  return {
    el,
    idx: el.querySelector('.idx'), ttl: el.querySelector('.ttl'),
    grp: el.querySelector('.grp'),
    badge: el.querySelector('.badge'), up: el.querySelector('.up'),
    dur: el.querySelector('.dur'), pred: el.querySelector('.pred'),
    tid: el.querySelector('.tid'), bar: el.querySelector('.bar>i'),
    note: el.querySelector('.note'), num: el.querySelector('.num b'),
    sub: el.querySelector('.num span'),
  };
}

function renderTasks(tasks) {
  const list = $('list');
  if (!tasks.length) {
    for (const n of nodes.values()) n.el.remove();
    nodes.clear();
    if (!list.querySelector('.empty')) {
      list.innerHTML = '<div class="empty"><b>尚无任务数据</b>启动管线后此处会实时刷新</div>';
    }
    return;
  }
  const empty = list.querySelector('.empty');
  if (empty) empty.remove();

  const seen = new Set();
  tasks.forEach((t, i) => {
    seen.add(t.id);
    let n = nodes.get(t.id);
    if (!n) { n = makeRow(); nodes.set(t.id, n); }

    const st = t.stage || 'queued';
    setClass(n.el, 'row ' + rowClass(st));            /* 类名不变则不动，避免动画重启 */
    setText(n.idx, String(i + 1).padStart(2, '0'));
    setText(n.ttl, t.title);
    setAttr(n.ttl, 'title', t.title);
    setText(n.badge, t.stage_label);
    setClass(n.badge, 'badge b-' + st);
    if (t.group) { setText(n.grp, t.group); n.grp.style.display = ''; }
    else n.grp.style.display = 'none';
    setText(n.up, t.up || '');      n.up.style.display = t.up ? '' : 'none';
    setText(n.dur, t.duration_sec ? '时长 ' + fmt(t.duration_sec) : '');
    n.dur.style.display = t.duration_sec ? '' : 'none';
    setText(n.pred, t.pred_sec ? '预计 ' + fmt(t.pred_sec) : '');
    n.pred.style.display = t.pred_sec ? '' : 'none';
    setText(n.tid, t.id);
    n.bar.style.width = Math.max(0, Math.min(100, t.pct || 0)) + '%';

    if (t.note) { setText(n.note, t.note); n.note.style.display = ''; }
    else n.note.style.display = 'none';
    setClass(n.note, 'note' + (st === 'fail' ? ' warn' : ''));

    if (st === 'done')      { setText(n.num, '100%'); setText(n.sub, fmt(t.elapsed)); }
    else if (st === 'fail') { setText(n.num, (t.pct || 0).toFixed(0) + '%'); setText(n.sub, '已中断'); }
    else {
      setText(n.num, (t.pct || 0).toFixed(0) + '%');
      setText(n.sub, fmt(t.elapsed) + (t.eta != null ? ' / 剩 ' + fmt(t.eta) : ''));
    }
    /* 顺序与后端一致（列表很短，直接对齐位置即可） */
    const at = list.children[i];
    if (at !== n.el) list.insertBefore(n.el, at || null);
  });

  for (const [id, n] of nodes) if (!seen.has(id)) { n.el.remove(); nodes.delete(id); }
}

/* ---------- 任务组（两个 skill 共用一个看板时区分来源） ---------- */
const groupNodes = new Map();
function renderGroups(groups) {
  const box = $('groups');
  if (!groups || !groups.length) {
    for (const n of groupNodes.values()) n.el.remove();
    groupNodes.clear();
    return;
  }
  const seen = new Set();
  groups.forEach((g, i) => {
    seen.add(g.name);
    let n = groupNodes.get(g.name);
    if (!n) {
      const el = document.createElement('div');
      el.className = 'gchip';
      el.innerHTML = '<span class="gn"></span><b class="gp"></b>'
                   + '<span class="gc"></span><div class="gbar"><i></i></div>';
      box.appendChild(el);
      n = {el, gn: el.querySelector('.gn'), gp: el.querySelector('.gp'),
           gc: el.querySelector('.gc'), bar: el.querySelector('.gbar>i')};
      groupNodes.set(g.name, n);
    }
    setText(n.gn, g.name);
    setText(n.gp, (g.pct || 0).toFixed(0) + '%');
    setText(n.gc, `${g.done}/${g.total}` + (g.failed ? ` · 失败 ${g.failed}` : ''));
    n.bar.style.width = Math.max(0, Math.min(100, g.pct || 0)) + '%';
    const at = box.children[i];
    if (at !== n.el) box.insertBefore(n.el, at || null);
  });
  for (const [k, n] of groupNodes) if (!seen.has(k)) { n.el.remove(); groupNodes.delete(k); }
}

/* ---------- 事件流：内容签名变化才重建 ---------- */
let logSig = '';
function renderLog(log) {
  const sig = (log || []).map(e => e.ts + e.task + e.note).join('|');
  if (sig === logSig) return;
  logSig = sig;
  $('log').innerHTML = (log || []).map(e => `<li>
      <span class="t">${clock(e.ts)}</span>
      <span class="s">${esc(e.stage_label || '')}</span>
      <span class="n">${e.task ? esc(e.task) + ' · ' : ''}${esc(e.note || '')}</span>
    </li>`).join('') || '<li><span class="n" style="color:#8296b8">暂无事件</span></li>';
}

/* ---------- 时间显示：本地时钟驱动 ----------
   服务端只在轮询时给一个采样值（POLL=700ms），而显示粒度是 1 秒，两者不同步；
   直接显示就会出现“停一下、跳两秒”的不均匀节拍（实测观测到的现象）。
   这里把服务端值当基准，之后交给本地时钟按 UI_TICK 平滑推进。
   外推上限 STALE_CAP：数据停更时冻结在最后值，不把“卡住”演成“还在跑”。 */
const UI_TICK = 250, STALE_CAP = 5, STALE_WARN = 10, STALE_BAD = 30;
let base = {at: 0, o: null, run: null};      /* at = 收到数据的本地时刻 */
const dataAge = () => base.at ? Math.max(0, (Date.now() - base.at) / 1000) : 0;
const drift = () => Math.min(dataAge(), STALE_CAP);

function paintTopTimes() {
  const o = base.o;
  if (!o) return;
  const d = drift(), age = dataAge(), sub = $('sub');
  setText($('sElapsed'), fmt((o.elapsed ?? 0) + d));
  setText($('sEta'), (o.total && o.done === o.total) ? '0s'
                  : fmt(o.eta == null ? null : Math.max(0, o.eta - d)));
  setText(sub, `${o.total} 个任务 · 引擎 ${(base.run || {}).engine || '—'}`
             + ` · 最后更新 ${ago(age)}`);
  /* 后台标签页会被浏览器降频，那时“多久没更新”不代表任何问题，不着色 */
  const lvl = document.hidden ? 0
            : age >= STALE_BAD ? 2 : age >= STALE_WARN ? 1 : 0;
  setClass(sub, 'sub' + (lvl === 2 ? ' stale-bad' : lvl === 1 ? ' stale-warn' : ''));
  if (o.updated) sub.title = '数据时刻 ' + clock(o.updated);
}

/* 任务行的时间同理；终态（done/fail）不参与外推，冻结在事件里记录的真实耗时 */
function paintTaskTimes() {
  for (const n of nodes.values()) {
    const t = n.t;
    if (!t) continue;
    if (t.stage === 'done') setText(n.sub, fmt(t.elapsed));
    else if (t.stage === 'fail') setText(n.sub, '已中断');
    else {
      const e = t.elapsed == null ? null : t.elapsed + drift();
      const x = t.eta == null ? null : Math.max(0, t.eta - drift());
      setText(n.sub, fmt(e) + (x != null ? ' / 剩 ' + fmt(x) : ''));
    }
  }
}

/* ---------- 顶部 ---------- */
function renderTop(d) {
  const o = d.overall;
  setText($('title'), d.run.title || '任务进度');
  const p = Math.max(0, Math.min(100, o.pct || 0));
  $('arc').style.strokeDashoffset = CIRC * (1 - p / 100);
  setText($('opct'), p.toFixed(0) + '%');
  setText($('sPct'), p.toFixed(1) + '%');
  setText($('sDone'), `${o.done} / ${o.total}`);
  setText($('sActive'), o.active);
  setText($('sFail'), o.failed);
  paintTopTimes();
}

/* ---------- 轮询 ---------- */
let timer = null, nextAt = 0, alive = true;
function setLive(ok) {
  if (ok === alive) return;
  alive = ok;
  $('live').classList.toggle('dead', !ok);
  setText($('liveTxt'), ok ? '实时连接' : '连接中断，重试中…');
}

async function tick() {
  try {
    const r = await fetch('/api/state', {cache: 'no-store'});
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    /* 基准时刻取本地钟：只用于算“距上次更新多久”，不跨机比较，省掉时钟同步 */
    base = {at: Date.now(), o: d.overall, run: d.run};
    renderTop(d);
    renderGroups(d.groups || []);
    renderTasks(d.tasks || []);
    renderLog(d.log || []);
    setLive(true);
  } catch (e) {
    setLive(false);
  } finally {
    schedule();
  }
}
function schedule() {
  const gap = document.hidden ? POLL_HIDDEN : POLL;
  /* 按目标时刻排期，而不是“响应后再等 700ms” —— 否则周期会变成 700ms+RTT，
     抖动进节拍，且误差随时间累积（跑十分钟就慢几秒）。 */
  nextAt = nextAt ? nextAt + gap : Date.now() + gap;
  if (nextAt <= Date.now()) nextAt = Date.now() + gap;   /* 落后（页面休眠）则重排 */
  clearTimeout(timer);
  timer = setTimeout(tick, Math.max(0, nextAt - Date.now()));
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { nextAt = 0; tick(); }
});
/* 本地时钟：只重写时间文本（setText 自带 diff），不受轮询节拍影响 */
setInterval(() => { paintTopTimes(); paintTaskTimes(); }, UI_TICK);
tick();
</script>
</body>
</html>
